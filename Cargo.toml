[package]
name = "pidag"
version = "0.1.0"
edition = "2024"
authors = ["${DEPLOY_USER}"]
license = "MIT"
repository = "https://github.com/bitscrafts/pidag"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net"] }
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
redb = "1.0"
bincode = "1.3"
reqwest = { version = "0.11", optional = true }
toml = "0.8"
sha2 = "0.10"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "2.2", features = ["server", "transport-io", "macros"] }
# Pinned to a revision rather than a branch: the build must be reproducible,
# and a moving branch would silently change what pidag is compiled against.
# This was an absolute local path, which meant pidag could not be built outside
# the container it was developed in.
pi = { package = "pi_agent_rust", git = "https://github.com/bitscrafts/pi_agent_rust.git", rev = "f87d3ff247cb", default-features = false }

[features]
mirror = ["reqwest"]

[[bin]]
name = "pidag"
path = "src/bin/pidag.rs"

[[bin]]
name = "crash_writer"
path = "src/bin/crash_writer.rs"

[[bench]]
name = "scheduler_bench"
harness = false

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
http = "1"
tempfile = "3"

# Debug symbols dominate artifact size once pi_agent_rust is linked: full symbols
# produced ~600MB per test binary and a 26G target/debug, which exhausted the linker.
# line-tables-only keeps usable backtraces at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
